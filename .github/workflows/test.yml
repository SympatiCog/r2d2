name: Tests

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main, develop ]

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.8", "3.9", "3.10", "3.11"]

    steps:
    - uses: actions/checkout@v3

    - name: Set up Python ${{ matrix.python-version }}
      uses: actions/setup-python@v4
      with:
        python-version: ${{ matrix.python-version }}

    - name: Install system dependencies
      run: |
        sudo apt-get update
        sudo apt-get install -y cmake build-essential

    - name: Install Python dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements-test.txt

    - name: Run tests with pytest
      run: |
        pytest test_r2d2_base.py -v --cov=r2d2_base --cov-report=xml --cov-report=term

    - name: Upload coverage to Codecov
      uses: codecov/codecov-action@v3
      with:
        file: ./coverage.xml
        fail_ci_if_error: false

  rust-ext:
    name: Rust extension (r2d2_rust)
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v3

    - name: Set up Python
      uses: actions/setup-python@v4
      with:
        python-version: "3.11"

    - name: Set up Rust
      uses: dtolnay/rust-toolchain@stable

    - name: Cache cargo build
      uses: actions/cache@v4
      with:
        path: |
          ~/.cargo/registry
          ~/.cargo/git
          rust_ext/target
        key: ${{ runner.os }}-cargo-${{ hashFiles('rust_ext/Cargo.toml') }}

    - name: Cargo test (Rust kernel)
      working-directory: rust_ext
      run: cargo test --release

    - name: Build and install the extension
      working-directory: rust_ext
      run: |
        python -m pip install --upgrade pip
        pip install maturin numpy pytest
        maturin build --release --out dist
        pip install dist/*.whl

    - name: Python validation tests
      working-directory: rust_ext
      # The ANTs parity test auto-skips here (ANTsPy not installed in CI).
      run: pytest tests/test_kernel.py -v
